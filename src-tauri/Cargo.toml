[package]
name = "bianqian"
version = "0.1.0"
description = "桌面便签工具：备忘、提醒、待办"
edition = "2021"

[lib]
name = "bianqian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 导出分享图：前端传 base64 PNG，Rust 解码后写文件
base64 = "0.22"
# AI 助手代理：默认 TLS 走 rustls + aws-lc（需 cmake/NASM），改用 native-tls 在 Windows 上走 schannel，
# 不引入 C 构建工具链依赖。http2 / system-proxy / charset 与默认特性保持一致；
# query 供联网搜索拼查询参数（0.13 起该能力为独立 feature，默认关闭）。
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "query",
    "native-tls",
    "http2",
    "system-proxy",
    "charset",
] }
futures-util = "0.3.34"

# 仅测试 / 示例使用（examples/search_probe.rs），不影响发布产物
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# 生产构建或 devPath 指向本地文件且内置 dev server 关闭时启用
default = []
