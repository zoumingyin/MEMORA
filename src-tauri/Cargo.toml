[package]
name = "bianqian"
version = "1.1.0"
description = "MEMORA — 个人桌面效率工具：备忘、提醒、待办、AI 助手"
edition = "2021"

[lib]
name = "bianqian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 数据库安全模块：只读检查、VACUUM INTO 快照、恢复校验（与 SQL 插件共用 sqlx 0.8）
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自实现「开机自启动」状态读取：插件底层 auto_launch 0.6 的 is_enabled 在 Windows 上
# 先读 HKLM\Run，非管理员无权限会抛 access-denied 且未忽略，导致整个判定失效，
# 故直接读 Run 键（HKCU 优先、HKLM 被拒忽略）以可靠反映真实开关状态
windows-registry = "0.6"
# 导出分享图：前端传 base64 PNG，Rust 解码后写文件
base64 = "0.22"
# AI 助手代理：默认 TLS 走 rustls + aws-lc（需 cmake/NASM），改用 native-tls 在 Windows 上走 schannel，
# 不引入 C 构建工具链依赖。http2 / system-proxy / charset 与默认特性保持一致；
# query 供联网搜索拼查询参数（0.13 起该能力为独立 feature，默认关闭）。
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "query",
    "native-tls",
    "http2",
    "system-proxy",
    "charset",
] }
futures-util = "0.3.34"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

# Windows 专用：原子下发窗口位置+尺寸（单个 SetWindowPos）。
# 版本对齐依赖树中 tauri 已带的 0.62，离线构建不引入新下载；
# hwnd() 返回值即该 crate 的 HWND，类型直接对上。
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }

# 仅测试 / 示例使用（examples/search_probe.rs），不影响发布产物
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# 生产构建或 devPath 指向本地文件且内置 dev server 关闭时启用
default = []
