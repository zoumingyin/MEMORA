<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/memora-app-icon.svg" />
    <title>MEMORA</title>
    <script src="/theme-boot.js"></script>
    <style>
      :root {
        --ink: #14213d;
        --muted: #64748b;
        --blue: #536dff;
        --cyan: #08c6c8;
        --danger: #e56875;
        --bg-a: #fbfcff;
        --bg-b: #eef3ff;
        --glow-l: #91a8ff;
        --glow-r: #73e4dc;
        --panel-bg: rgba(255, 255, 255, 0.62);
        --panel-border: rgba(255, 255, 255, 0.85);
        --panel-shadow: 0 28px 90px rgba(61, 83, 150, 0.13);
        --message: #344563;
        --track: #e1e8fb;
        --status: #8290a8;
      }

      :root[data-theme='dark'] {
        --ink: #e8edfa;
        --muted: #a8b4cc;
        --blue: #8292ff;
        --bg-a: #111827;
        --bg-b: #182235;
        --glow-l: #3b4a8f;
        --glow-r: #1c5f5c;
        --panel-bg: rgba(24, 34, 53, 0.72);
        --panel-border: rgba(168, 180, 204, 0.16);
        --panel-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
        --message: #c8d3e8;
        --track: #2d3b54;
        --status: #7f8ca6;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 15% 15%, color-mix(in srgb, var(--glow-l) 22%, transparent) 0, transparent 42%),
          radial-gradient(ellipse at 85% 80%, color-mix(in srgb, var(--glow-r) 22%, transparent) 0, transparent 42%),
          linear-gradient(135deg, var(--bg-a), var(--bg-b));
      }

      .glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.38;
        background: var(--glow-l);
        left: -160px;
        bottom: -230px;
      }
      .glow.r { left: auto; right: -170px; top: -230px; background: var(--glow-r); }

      .panel {
        position: relative;
        width: min(520px, calc(100vw - 48px));
        padding: 58px 44px 42px;
        text-align: center;
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        background: var(--panel-bg);
        box-shadow: var(--panel-shadow);
        backdrop-filter: blur(22px);
      }

      .mark { width: 82px; height: 82px; margin: 0 auto 18px; display: block; }
      .brand { font-size: 36px; font-weight: 750; letter-spacing: 2px; }
      .tag { margin-top: 9px; color: var(--muted); font-size: 13px; letter-spacing: 4px; }
      .message { margin-top: 26px; font-size: 15px; color: var(--message); }

      .track {
        height: 5px;
        margin: 34px auto 12px;
        max-width: 230px;
        border-radius: 9px;
        background: var(--track);
        overflow: hidden;
      }
      /* 宽度只由真实里程碑驱动（splash:state），不做循环动画冒充进度 */
      .bar {
        height: 100%;
        width: 0;
        border-radius: 9px;
        background: linear-gradient(90deg, var(--blue), var(--cyan));
        transition: width 0.28s ease-out;
      }
      .status { font-size: 12px; color: var(--status); min-height: 18px; }

      .error { margin-top: 18px; font-size: 12.5px; line-height: 1.7; color: var(--danger); }
      .dismiss {
        margin-top: 14px;
        padding: 6px 18px;
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        cursor: pointer;
      }
      .dismiss:hover { border-color: var(--blue); color: var(--blue); }
      [hidden] { display: none !important; }

      @media (prefers-reduced-motion: reduce) {
        .bar { transition: none; }
        .glow { filter: none; opacity: 0.16; }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow r"></div>
    <main class="panel">
      <img class="mark" src="/brand/memora-mark.svg" alt="" aria-hidden="true" />
      <div class="brand">MEMORA</div>
      <div class="tag">THINK · NOTE · DO</div>
      <div class="message">让每一个想法都有回响</div>
      <div class="track"><div class="bar" id="bar"></div></div>
      <div class="status" id="status">正在启动…</div>
      <p class="error" id="error" hidden></p>
      <button class="dismiss" id="dismiss" type="button" hidden>关闭</button>
    </main>
    <script type="module" src="/src/splashMain.ts"></script>
  </body>
</html>
